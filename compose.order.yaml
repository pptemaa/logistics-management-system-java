services:
  order-db:
    image: postgres:17
    environment:
      POSTGRES_DB: logistics_orders
      POSTGRES_USER: logistics
      POSTGRES_PASSWORD: logistics_dev
    ports:
      - "5435:5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logistics -d logistics_orders"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  order-db-data:
