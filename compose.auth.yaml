services:
  auth-db:
    image: postgres:17
    environment:
      POSTGRES_DB: logistics_auth
      POSTGRES_USER: logistics
      POSTGRES_PASSWORD: logistics_dev
    ports:
      - "5432:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logistics -d logistics_auth"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  auth-db-data:
