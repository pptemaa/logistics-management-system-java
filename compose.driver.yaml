services:
  driver-db:
    image: postgres:17
    environment:
      POSTGRES_DB: logistics_drivers
      POSTGRES_USER: logistics
      POSTGRES_PASSWORD: logistics_dev
    ports:
      - "5433:5432"
    volumes:
      - driver-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logistics -d logistics_drivers"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  driver-db-data:
